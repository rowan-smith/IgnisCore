# Signal Charge
#
# A charge that can only be detonated with a paired detonator item.
# Left-click the charge with a detonator to link it, then right-click
# with the detonator to set it off.

id: signal-charge

display:
  title: "&cSignal Charge"
  description:
    - "&7Pair with a detonator"
    - "&7to detonate remotely"

block:
  placeable: true
  breakable: true
  breaking:
    ticks: 0
    break_sound: BLOCK_GRAVEL_BREAK
    hit_sound: BLOCK_GRAVEL_HIT

textures:
  top: top.jpg
  side: side.jpg
  bottom: bottom.jpg

model:
  type: "block_display"
  mode: "auto"

behavior:
  custom_data:
    fuse: 0
    radius: 6.0
    power: 6.0
    fire: false
    blockDamage: true
