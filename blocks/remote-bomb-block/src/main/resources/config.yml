# Signal Charge
#
# A charge that can only be detonated with a paired detonator item.
# Left-click the charge with a detonator to link it, then right-click
# with the detonator to set it off.

id: signal-charge

display:
  title: "&cSignal Charge"
  description:
    - "&7Pair with a detonator"
    - "&7to detonate remotely"

block:
  placeable: true
  breakable: true
  base_material: paper
  render_material: carrot_on_a_stick
  breaking:
    ticks: 40
    hit_interval_ticks: 6
    hit_sound: BLOCK_STONE_HIT
    break_sound: BLOCK_STONE_BREAK
    tool_ticks:
      _PICKAXE: 18
      _AXE: 28
      _SHOVEL: 28
    particles:
      hit:
        - type: CRIT
          count: 3
          offset_x: 0.30
          offset_y: 0.30
          offset_z: 0.30
          speed: 0.02
      break:
        - type: BLOCK
          block: TNT
          count: 24
          offset_x: 0.35
          offset_y: 0.35
          offset_z: 0.35
          speed: 0.01
        - type: SMOKE
          count: 8
          offset_x: 0.25
          offset_y: 0.25
          offset_z: 0.25
          speed: 0.01

textures:
  top: top.png
  side: side.png
  bottom: bottom.png

model:
  type: "block_display"
  mode: "auto"

block_display:
  scale: 1.01
  offset_x: 0.0
  offset_y: 0.5
  offset_z: 0.0
  view_range: 1.0
  block_light: 15
  sky_light: 15
  animations:
    pulse: true

behavior:
  strategy: signal-charge
  strategy_name: Signal Charge
  fuse: 0
  radius: 6.0
  custom_data:
    power: 6.0
    fire: false
    blockDamage: true
