# Quarry Cache
#
# Automatically collects block drops from a nearby area and stores them
# for later retrieval. Place the block, mine nearby, and right-click to
# open the storage GUI.

id: quarry-cache

display:
  title: "&6Quarry Cache"
  description:
    - "&7Automatically collects block drops"
    - "&7from a nearby area."
    - ""
    - "&eLeft-click&7 to break"
    - "&eRight-click&7 to open storage"
    - "&eTop row&7 sets item filters"

block:
  placeable: true
  breakable: true
  base_material: paper
  render_material: carrot_on_a_stick
  breaking:
    ticks: 35
    hit_interval_ticks: 5
    hit_sound: BLOCK_STONE_HIT
    break_sound: BLOCK_STONE_BREAK
    tool_ticks:
      _PICKAXE: 18
      _AXE: 24
      _SHOVEL: 24

textures:
  top: top.jpg
  side: side.jpg
  bottom: bottom.jpg

model:
  type: "block_display"
  mode: "auto"

interactions:
  left_click:
    default_action: break
  right_click:
    action: open

behavior:
  strategy: quarry-cache
  strategy_name: Quarry Cache
  custom_data:
    collectRadius: 5.0
