name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B package -DskipTests
