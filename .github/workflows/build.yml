name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: chmod +x scripts/*.sh && ./scripts/build-all.sh -DskipTests
