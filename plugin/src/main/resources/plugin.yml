name: IgnisCore
version: '${version}'
author: Rono
description: A custom block and item system for Minecraft

main: dev.rono.igniscore.Main
api-version: '1.21'
depend: [NBTAPI]
softdepend: [ProtocolLib]
prefix: IgnisCore

commands:
  ignis:
    description: Main command for IgnisCore
    usage: /ignis <give|pack|reload|debug|blocks|items>
    aliases: [igniscore, ic]
    permission: igniscore.admin

permissions:
  igniscore.admin:
    description: Allows access to all IgnisCore commands
    default: op
