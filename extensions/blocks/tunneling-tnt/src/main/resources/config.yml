# Tunneling TNT
#
# A directional excavation explosive designed for terrain carving.
#
# Rather than a single blast, it detonates repeatedly in a straight
# line over a fixed distance, clearing blocks along its path.
# This creates a clean tunnel or corridor through terrain, making
# it useful for rapid mining or traversal.

id: tunneling-tnt

display:
  title: "Tunneling TNT"
  description:
    - "&4Complete"
    - "&4Destruction"

block:
  placeable: true
  breakable: true
  breaking:
    ticks: 0
    break_sound: BLOCK_GRAVEL_BREAK
    hit_sound: BLOCK_GRAVEL_HIT

textures:
  top: top.png
  side: side.png
  bottom: bottom.png

model:
  type: "block_display"
  mode: "auto"

behavior:
  combustible: true
  left_click_block: break
  right_click_block: ignite
  ignition_materials:
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - FLINT
  sounds:
    place: BLOCK_BEACON_ACTIVATE
    ignite: ITEM_FLINTANDSTEEL_USE

custom_data:
    fuse: 60
    radius: 4.0
    power: 4.0
    fire: false
    blockDamage: true
    tunnelLength: 16
    tunnelGap: 2.0
