# Phantom TNT
#
# A stealth-based explosive that becomes invisible after ignition.
#
# Once primed, the TNT disappears from view like a phantom but continues
# its fuse timer normally. It detonates as a standard explosion while
# remaining hidden, making it difficult for players to locate or avoid.

id: phantom-tnt

display:
  title: "Phantom TNT"
  description:
    - "&4Complete"
    - "&4Destruction"

block:
  placeable: true
  breakable: true
  breaking:
    ticks: 0
    break_sound: BLOCK_GRAVEL_BREAK
    hit_sound: BLOCK_GRAVEL_HIT

textures:
  top: top.png
  side: side.png
  bottom: bottom.png

model:
  type: "block_display"
  mode: "auto"

behavior:
  combustible: true
  left_click_block: break
  right_click_block: ignite
  ignition_materials:
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - FLINT
  sounds:
    place: BLOCK_BEACON_ACTIVATE
    ignite: ITEM_FLINTANDSTEEL_USE

custom_data:
    fuse: 160
    radius: 6.0
    power: 4.0
    fire: false
    blockDamage: true
