# Wormhole TNT
#
# A spatial distortion explosive that manipulates nearby matter before detonation.
#
# On priming, it creates a temporary wormhole that pulls in entities, mobs,
# players, blocks, and dropped items. Everything is drawn toward a single
# point before the wormhole collapses, releasing a powerful outward explosion
# that ejects all collected matter violently across the area.

id: wormhole-tnt

display:
  title: "Wormhole TNT"
  description:
    - "&4Complete"
    - "&4Destruction"

block:
  placeable: true
  breakable: true
  breaking:
    ticks: 0
    break_sound: BLOCK_GRAVEL_BREAK
    hit_sound: BLOCK_GRAVEL_HIT

textures:
  top: top.png
  side: side.png
  bottom: bottom.png

model:
  type: "block_display"
  mode: "auto"

behavior:
  combustible: true
  left_click_block: break
  right_click_block: ignite
  ignition_materials:
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - FLINT
  sounds:
    place: BLOCK_BEACON_ACTIVATE
    ignite: ITEM_FLINTANDSTEEL_USE

custom_data:
    fuse: 100
    radius: 12.0
    power: 10.0
    fire: false
    blockDamage: true
    wormholeRipRadius: 4
    wormholeRipStartTicks: 60
    wormholeRipChance: 0.05
