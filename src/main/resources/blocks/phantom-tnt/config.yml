# Phantom TNT
#
# A stealth-based explosive that becomes invisible after ignition.
#
# Once primed, the TNT disappears from view like a phantom but continues
# its fuse timer normally. It detonates as a standard explosion while
# remaining hidden, making it difficult for players to locate or avoid.

id: phantom-tnt

display:
  title: "Phantom TNT"
  description:
    - "&4Complete"
    - "&4Destruction"

textures:
  top: phantom-tnt-top.png
  side: phantom-tnt-side.png
  bottom: phantom-tnt-bottom.png

model:
  type: "block_display"
  mode: "auto"