name: IgnisCore
version: '${project.version}'
author: Rono
description: Multi-platform custom block and item system for Minecraft

main: dev.rono.igniscore.bootstrap.IgnisBootstrapPlugin
api-version: '1.21'
depend: []
softdepend: [NBTAPI, ProtocolLib, WorldEdit, FastAsyncWorldEdit, DecentHolograms, Citizens]
prefix: IgnisCore

permissions:
  igniscore.admin:
    description: Allows access to all IgnisCore commands
    default: op
